<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Iqbal Trader · Salesman</title>
<link rel="manifest" href="/salesman.webmanifest" /><link rel="icon" href="/salesman-192.png" /><meta name="theme-color" content="#0B1120" />
<style>
:root{--bg:#0B1120;--card:rgba(17,24,39,.75);--line:rgba(148,163,184,.16);--txt:#E8EEF8;--dim:#8B98AE;--blue:#3B82F6;--cyan:#22D3EE;--ok:#34D399;--warn:#FBBF24;--bad:#F87171}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 400px at 90% -5%,rgba(59,130,246,.18),transparent 60%),var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,sans-serif;padding-bottom:84px;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(11,17,32,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top b{font-size:16px}.top small{display:block;color:var(--dim);font-size:11px}
main{padding:16px;max-width:720px;margin:auto}h2{margin:4px 0 14px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;margin:4px 0 10px;background:#0a1020;border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit}
label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,#3B82F6,#2563EB);cursor:pointer}
button.g{background:rgba(255,255,255,.06);border:1px solid var(--line)}button.full{width:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,17,32,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;font-size:11px;color:var(--dim);padding:6px 2px;border-radius:10px}nav a.on{color:#fff;background:rgba(59,130,246,.2)}nav a i{display:block;font-style:normal;font-size:19px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{color:var(--dim);display:block}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}.ok{background:rgba(52,211,153,.15);color:var(--ok)}.wn{background:rgba(251,191,36,.15);color:var(--warn)}.bd{background:rgba(248,113,113,.15);color:var(--bad)}
.note{color:var(--dim);font-size:12px;text-align:center;margin:6px 0 14px}.err{color:var(--bad);font-size:13px;min-height:18px}
.login{max-width:380px;margin:12vh auto;padding:0 20px}.login .logo{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 14px}
.item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qty{display:inline-block;min-width:34px;text-align:center;padding:2px 9px;border-radius:8px;background:rgba(59,130,246,.2);color:#93C5FD;font-weight:700}
</style></head><body>
<div id="app"></div>
<script>
const $=(s)=>document.querySelector(s),app=$('#app');let tok=localStorage.getItem('sm_tok'),D={kinds:{},outbox:[]},tab='stock',items=[],msg='';
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=(n)=>'Rs '+Math.round(Number(n)||0).toLocaleString('en-US');
const K=(k)=>(D.kinds[k]&&D.kinds[k].data)||[];
async function api(p,o={}){const r=await fetch('/api/salesman'+p,{...o,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})}});const d=await r.json().catch(()=>({}));if(r.status===401&&tok){logout();throw new Error(d.error)}if(!r.ok)throw new Error(d.error||'Error');return d}
function logout(){localStorage.removeItem('sm_tok');tok=null;draw()}
async function load(){if(!tok)return;try{D=await api('/me/data');if(!document.activeElement||!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))draw()}catch(e){}}
function stamp(){const u=D.kinds.stock&&D.kinds.stock.updated_at;return u?`<div class="note">Data aakhri update: ${new Date(u).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`:''}
function loginView(){app.innerHTML=`<div class="login"><img class="logo" src="/salesman-192.png"><h2 style="text-align:center">Salesman Login</h2><div class="card"><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="e"></div><button class="full" id="go">Login</button></div></div>`;
$('#go').onclick=async()=>{try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})});tok=d.token;localStorage.setItem('sm_tok',tok);localStorage.setItem('sm_name',d.name);await load();draw()}catch(e){$('#e').textContent=e.message}}}
function tabs(){return[['stock','📦','Stock'],['sale','🧾','Nayi Sale'],['pending','⏳','Pending'],['recovery','💵','Recovery'],['requests','📨','Requests']].map(t=>`<a class="${tab===t[0]?'on':''}" data-t="${t[0]}"><i>${t[1]}</i>${t[2]}</a>`).join('')}
function view(){
 if(tab==='stock'){const q=(window._q||'').toLowerCase();return`<h2>Stock</h2><input id="q" placeholder="Product dhoondein…" value="${esc(window._q||'')}">${stamp()}<div class="card">${K('stock').filter(p=>!q||(p.name+' '+(p.company_name||'')).toLowerCase().includes(q)).map(p=>`<div class="row"><div>${esc(p.name)}<small>${esc(p.company_name||'')} · ${rs(p.selling_price)}/pc</small></div><div style="text-align:right"><span class="qty">${p.stock_cartons||0}</span> ctn${p.stock_boxes?` <span class="qty">${p.stock_boxes}</span> box`:''}${p.stock_pcs?` <span class="qty">${p.stock_pcs}</span> pc`:''}</div></div>`).join('')||'<div class="note">Koi data nahi</div>'}</div>`}
 if(tab==='sale'){const tot=items.reduce((s,i)=>s+lineTotal(i),0);return`<h2>Nayi Sale</h2><div class="note">Sale submit hone ke baad Manager confirm kare ga tab final hogi.</div><div class="card"><label>Customer</label><select id="cust"><option value="">Customer chunein</option>${K('allcustomers').map(c=>`<option value="${c.id}">${esc(c.shop_name)}</option>`).join('')}</select>${items.map((it,i)=>`<div class="item"><select data-i="${i}" data-f="product_id">${K('stock').map(p=>`<option value="${p.id}" ${p.id==it.product_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="two"><div><label>Unit</label><select data-i="${i}" data-f="unit_type">${['Carton','Box','Piece'].map(u=>`<option ${u===it.unit_type?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Qty</label><input type="number" min="0" inputmode="decimal" data-i="${i}" data-f="quantity" value="${it.quantity}"></div><div><label>Rate / piece</label><input type="number" inputmode="decimal" data-i="${i}" data-f="selling_price" value="${it.selling_price}"></div><div><label>Discount</label><input type="number" inputmode="decimal" data-i="${i}" data-f="discount" value="${it.discount}"></div></div><div class="row"><b>${rs(lineTotal(it))}</b><button class="g" data-rm="${i}">Hatayein</button></div></div>`).join('')}<button class="g full" id="add">+ Item add karein</button><div class="row" style="margin-top:10px"><b>Total: ${rs(tot)}</b></div><div class="err">${esc(msg)}</div><button class="full" id="sub">Sale Submit Karein</button></div>`}
 if(tab==='pending'){return`<h2>Pending Sales</h2>${stamp()}${D.outbox.filter(o=>o.type==='sale'&&o.status!=='done').map(o=>`<div class="card"><div class="row"><div>Phone se bheji gayi sale<small>${new Date(o.created_at).toLocaleString('en-GB')}</small></div>${o.status==='failed'?`<span class="pill bd">Masla: ${esc((o.result||{}).error)}</span>`:'<span class="pill wn">DMS ke intezar mein</span>'}</div></div>`).join('')}<div class="card">${K('pending').map(s=>`<div class="row"><div>${esc(s.customer_name)}<small>${esc(s.reject_reason||'')}</small></div><div style="text-align:right">${rs(s.total_amount)}<br><span class="pill ${s.status==='rejected'?'bd':'wn'}">${s.status==='rejected'?'Reject':'Approval ka intezar'}</span></div></div>`).join('')||'<div class="note">Koi pending sale nahi</div>'}</div>`}
 if(tab==='recovery'){return`<h2>Recovery</h2>${stamp()}<div class="card">${K('customers').map(c=>`<div class="row"><div>${esc(c.shop_name)}<small>${esc(c.phone||'')} ${esc(c.address||'')}</small></div><div style="text-align:right"><b style="color:var(--bad)">${rs(c.outstanding)}</b><br><button data-pay="${c.id}" style="padding:6px 12px;margin-top:4px">Wasooli</button></div></div>`).join('')||'<div class="note">Koi customer assign nahi</div>'}</div><div id="payBox"></div>`}
 return`<h2>Requests</h2>${stamp()}<div class="card"><label>Qism</label><select id="rt"><option value="request">Request</option><option value="complaint">Complaint</option></select><label>Subject</label><input id="rs"><label>Tafseel</label><textarea id="rm" rows="3"></textarea><div class="err">${esc(msg)}</div><button class="full" id="rsend">Bhejein</button></div><div class="card">${K('requests').map(r=>`<div class="row"><div>${esc(r.subject)}<small>${esc(r.message||'')}</small></div><span class="pill wn">${esc(r.status)}</span></div>`).join('')||'<div class="note">Abhi koi request nahi</div>'}</div>`}
function lineTotal(i){const p=K('stock').find(x=>x.id==i.product_id)||{};const m=i.unit_type==='Carton'?(p.pieces_per_carton||1):i.unit_type==='Box'?(p.pieces_per_box||1):1;return(Number(i.quantity)||0)*m*(Number(i.selling_price)||0)-(Number(i.discount)||0)}
function newItem(){const p=K('stock')[0]||{};return{product_id:p.id,unit_type:'Carton',quantity:1,selling_price:p.selling_price||0,discount:0}}
const submit=(type,payload)=>api('/submit',{method:'POST',body:JSON.stringify({type,payload,client_ref:crypto.randomUUID()})});
function draw(){if(!tok)return loginView();app.innerHTML=`<div class="top"><div><b>${esc(localStorage.getItem('sm_name')||'')}</b><small>Iqbal Trader · Salesman</small></div><button class="g" id="lo" style="padding:8px 12px">Logout</button></div><main>${view()}</main><nav>${tabs()}</nav>`;
 $('#lo').onclick=logout;document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{tab=a.dataset.t;msg='';draw()});
 if($('#q'))$('#q').oninput=(e)=>{window._q=e.target.value;draw();const q=$('#q');q.focus();q.setSelectionRange(99,99)};
 document.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{const it=items[el.dataset.i];it[el.dataset.f]=el.value;if(el.dataset.f==='product_id'){const p=K('stock').find(x=>x.id==el.value);it.selling_price=p?p.selling_price:0}draw()});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{items.splice(b.dataset.rm,1);draw()});
 if($('#add'))$('#add').onclick=()=>{items.push(newItem());draw()};
 if($('#sub'))$('#sub').onclick=async()=>{const c=$('#cust').value;if(!c||!items.length){msg='Customer aur item zaroori hain.';return draw()}try{await submit('sale',{invoice_number:'',sale_date:new Date().toLocaleDateString('en-CA'),customer_id:Number(c),items:items.map(i=>({product_id:Number(i.product_id),unit_type:i.unit_type,quantity:Number(i.quantity),selling_price:Number(i.selling_price),discount:Number(i.discount)||0}))});items=[];msg='';tab='pending';await load();draw()}catch(e){msg=e.message;draw()}};
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{$('#payBox').innerHTML=`<div class="card"><h2>Wasooli</h2><label>Amount</label><input id="pa" type="number" inputmode="decimal"><label>Tareeqa</label><select id="pm"><option>Cash</option><option>Bank Transfer</option><option>JazzCash / Easypaisa</option></select><label>Note</label><input id="pn"><div class="err" id="pe"></div><button class="full" id="pg">Jama Karein</button></div>`;$('#pg').onclick=async()=>{if(!(Number($('#pa').value)>0))return $('#pe').textContent='Amount likhein.';try{await submit('payment',{customer_id:Number(b.dataset.pay),date:new Date().toLocaleDateString('en-CA'),amount:Number($('#pa').value),method:$('#pm').value,notes:$('#pn').value});$('#payBox').innerHTML='<div class="card"><span class="pill ok">Wasooli bhej di gayi. DMS mein aate hi record hogi.</span></div>'}catch(e){$('#pe').textContent=e.message}}});
 if($('#rsend'))$('#rsend').onclick=async()=>{if(!$('#rs').value.trim()){msg='Subject likhein.';return draw()}try{await submit('request',{type:$('#rt').value,subject:$('#rs').value,message:$('#rm').value});msg='';alert('Request bhej di gayi.');draw()}catch(e){msg=e.message;draw()}}}
load().then(draw);setInterval(load,60000);
</script></body></html>
