<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />

<style>
:root{--bg:#F5F7FB;--card:#fff;--txt:#111827;--dim:#6B7280;--line:#E5E7EB;--in:#F9FAFB;--ind:#4F46E5;--ind2:#6366F1;--ok:#059669;--bad:#E11D48;--warn:#D97706}
body.dark{--bg:#0F1220;--card:#181B2E;--txt:#E5E7EB;--dim:#9CA3AF;--line:#2A2E45;--in:#10132A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 'Plus Jakarta Sans',Inter,system-ui,sans-serif}
.side{position:fixed;inset:0 auto 0 0;width:270px;background:linear-gradient(180deg,#0B1020,#171A33);color:#E5E7EB;z-index:30;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column}
.side.open{transform:none}.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}.ov.show{display:block}
.prof{display:flex;gap:12px;align-items:center;padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.av{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#8B5CF6,#4F46E5);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.prof b{display:block}.prof small{color:#9CA3AF}
.nv{padding:14px 12px;flex:1;overflow-y:auto}.nv a{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;color:#CBD5E1;margin-bottom:4px;font-weight:500;cursor:pointer}.nv a.on{background:linear-gradient(90deg,#4338CA,#4F46E5);color:#fff;box-shadow:inset 3px 0 0 #FBBF24}
.sb{padding:12px}.sb button{width:100%;margin-bottom:8px;background:rgba(255,255,255,.07);color:#E5E7EB;border:0;border-radius:12px;padding:12px;font:inherit;cursor:pointer;text-align:left}.sb .lo{background:rgba(190,18,60,.18);color:#FDA4AF;text-align:center}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}.top button{background:none;border:0;font-size:22px;color:var(--txt);cursor:pointer}
main{padding:16px;max-width:1100px;margin:auto}h1{font-size:24px;margin:6px 0 14px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.hero{background:linear-gradient(135deg,#14193A,#0B1020);color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.hero small{color:#9CA3AF}.hero b{display:block;font-size:24px;margin:4px 0}
.sec{color:var(--dim);margin:16px 2px 8px;font-size:13px}.g{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
.st{background:var(--card);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}.ic{width:42px;height:42px;border-radius:12px;background:var(--in);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.st small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}.st b{font-size:20px}
label{font-size:12px;color:var(--dim);display:block;margin-bottom:3px}input,select,textarea{width:100%;padding:12px 13px;background:var(--in);border:1px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;margin-bottom:10px}input:disabled{opacity:.5}
button.p{background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(79,70,229,.3)}button.p.full{width:100%}
button.s{background:var(--in);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.it{background:var(--in);border-radius:12px;padding:10px;margin-bottom:10px}.it .gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.it input,.it select{background:var(--card);margin-bottom:4px}
.hint{font-size:12px;border-radius:8px;padding:5px 9px;margin:4px 0;display:block}.b1{background:#EEF2FF;color:#4338CA}.r1{background:#FFF1F2;color:var(--bad);font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--dim);font-size:12.5px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}.ok{background:#D1FAE5;color:var(--ok)}.wn{background:#FEF3C7;color:var(--warn)}.bd{background:#FFE4E6;color:var(--bad)}
.seg{display:inline-flex;background:var(--in);border-radius:12px;padding:4px;margin-bottom:12px}.seg a{padding:8px 16px;border-radius:9px;color:var(--dim);cursor:pointer}.seg a.on{background:#2563EB;color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th{background:#1F2937;color:#fff;text-align:left;padding:10px;white-space:nowrap}td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.note{color:var(--dim);font-size:12px;margin:2px 0 12px}.err{color:var(--bad);font-size:13px;min-height:16px}.big{background:linear-gradient(135deg,#6366F1,#7C3AED);color:#fff;border-radius:16px;padding:18px}.big.r{background:linear-gradient(135deg,#F43F5E,#E11D48)}.big b{font-size:26px;display:block}
.qty{display:inline-block;min-width:28px;text-align:center;padding:1px 8px;border-radius:7px;background:#EEF2FF;color:#4338CA;font-weight:700}.dn{width:120px;height:120px;border-radius:50%;margin:8px auto}
#toast{position:fixed;left:14px;right:14px;bottom:20px;z-index:99}#toast div{background:#111827;color:#fff;border-radius:12px;padding:12px 16px;margin-top:8px}
.pk{position:relative}.pkl{display:none;position:absolute;left:0;right:0;top:calc(100% - 10px);z-index:15;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.2);max-height:min(300px,45vh);overflow-y:auto}.pkl.show{display:block}.pkl div{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}.pkl div:last-child{border:0}.pkl div:active{background:var(--in)}.pkl b{display:block;font-size:14px}.pkl small{color:var(--dim);font-size:12px}
.sk{padding:13px 0;border-bottom:1px solid var(--line)}.sk:last-child{border:0}.sk b{font-size:15px}.sk .m{color:var(--dim);font-size:12.5px;margin-top:2px}.sk .f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{background:#EEF2FF;color:#4338CA;font-weight:700;border-radius:10px;padding:5px 11px;font-size:13px}.chip.out{background:#FFE4E6;color:var(--bad)}body.dark .chip{background:#26295A;color:#C7D2FE}.sk .pr{font-size:13px;color:var(--dim)}
.lg{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;background:radial-gradient(600px 380px at 85% -5%,rgba(99,102,241,.38),transparent 60%),radial-gradient(500px 320px at -10% 105%,rgba(14,165,233,.22),transparent 60%),linear-gradient(180deg,#0B1020,#14172E);color:#E5E7EB}.lg>*{max-width:420px;width:100%;margin-left:auto;margin-right:auto}
.lgb{text-align:center;margin-bottom:26px}.lgb img{width:76px;height:76px;border-radius:22px;box-shadow:0 12px 34px rgba(99,102,241,.45)}.lgt{font-weight:800;letter-spacing:.28em;margin-top:14px;font-size:17px;color:#fff}.lgs{color:#9CA3AF;font-size:13px;margin-top:4px}.lgq{text-align:center;color:#CBD5E1;margin-bottom:14px}
.rc{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:.2s}.rc:hover,.rc:active{background:rgba(99,102,241,.25);border-color:#6366F1}
.ri{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#6366F1,#4F46E5);display:grid;place-items:center;font-size:25px;flex-shrink:0}.rc b{display:block;font-size:16px;color:#fff}.rc small{color:#9CA3AF;font-size:12.5px}.ra{margin-left:auto;font-size:26px;color:#6B7280}
.lgf{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px}.lgf h2{margin:8px 0 14px;color:#fff;font-size:21px}.lgf label{color:#9CA3AF}.lgf input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.bk{color:#A5B4FC;cursor:pointer;font-size:14px}.pw{position:relative}.pw a{position:absolute;right:14px;top:13px;color:#A5B4FC;font-size:13px;cursor:pointer}.lgf .err{color:#FDA4AF}
.login{max-width:380px;margin:12vh auto;padding:0 20px}.login img{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 14px}
.ob{border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:13px}.ob.off{background:#FEF3C7;color:#92400E}.ob.q{background:#E0E7FF;color:#3730A3}.ob.bad{background:#FFE4E6;color:#9F1239}.ob a{text-decoration:underline;cursor:pointer;margin-left:10px}.qi{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid rgba(0,0,0,.08)}.qi small{opacity:.75}
body.exporting .tw{overflow:visible}body.exporting #repOut,body.exporting #expOut{width:max-content;min-width:100%}
@media(min-width:900px){.side{transform:none}.ov{display:none!important}.top button{display:none}.shell{margin-left:270px}.g{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:repeat(4,1fr)}.it .gr{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');let tok=localStorage.getItem('sm_tok'),D={kinds:{},outbox:[]},tab=localStorage.getItem('sm_role')==='manager'?'mpending':'overview',menu=false,msg='';
let S={cust:'',inv:'',date:new Date().toLocaleDateString('en-CA'),items:[]},P={mode:'year',val:String(new Date().getFullYear())};
document.body.classList.toggle('dark',localStorage.getItem('sm_dark')==='1');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'Rs '+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US'),r2=n=>Math.round((Number(n)||0)*100)/100;
const K=k=>(D.kinds[k]&&D.kinds[k].data)||(k==='summary'||k==='batchinfo'?{}:[]);
const toast=m=>{if(Date.now()-(window._queued||0)<900&&/bhej/i.test(m))return;const t=document.createElement('div');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),3500)};
async function api(p,o={}){let r;try{r=await fetch('/api/salesman'+p,{...o,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})}})}catch(e){const er=new Error('Internet nahi hai.');er.net=true;throw er}const d=await r.json().catch(()=>({}));if(r.status===401&&tok){logout();throw new Error(d.error)}if(!r.ok)throw new Error(d.error||'Error');return d}
function logout(){localStorage.removeItem('sm_cache');localStorage.removeItem('sm_tok');localStorage.removeItem('sm_role');tok=null;draw()}
async function load(){if(!tok)return;try{D=await api('/me/data');try{localStorage.setItem('sm_cache',JSON.stringify(D))}catch(e){}bizLoad();flush();D.outbox.filter(o=>o.status==='failed').forEach(o=>MD.delete((o.type.includes('sale')?'s':'r')+((o.payload||{}).id)));const a=document.activeElement;if(tab!=='sale'&&!(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)))draw()}catch(e){}}
const stamp=()=>{const u=D.kinds.stock&&D.kinds.stock.updated_at;return u?`<div class="note">Data aakhri update: ${new Date(u).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`:''};
const stat=(i,l,v,c)=>`<div class="st"><div class="ic">${i}</div><div><small>${l}</small><b ${c?`style="color:${c}"`:''}>${v}</b></div></div>`;
const inP=d=>d&&(P.mode==='day'?d===P.val:d.startsWith(P.val));
function periodUI(){const t=P.mode==='day'?'date':P.mode==='month'?'month':'number';return`<div class="card" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><div class="seg" style="margin:0">${['day','month','year'].map(m=>`<a data-pm="${m}" class="${P.mode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</a>`).join('')}</div><input id="pv" type="${t}" value="${esc(P.val)}" style="width:170px;margin:0"></div>`}
const COL=['#6366F1','#F59E0B','#10B981','#F43F5E','#06B6D4','#8B5CF6'];
function donut(rows){const by={};rows.forEach(r=>by[r.category||'Other']=(by[r.category||'Other']||0)+Number(r.amount));const e=Object.entries(by),tot=e.reduce((s,x)=>s+x[1],0);if(!tot)return'<div class="note">Abhi koi data nahi.</div>';let a=0;const g=e.map((x,i)=>{const s=a;a+=x[1]/tot*100;return`${COL[i%6]} ${s}% ${a}%`}).join(',');return`<div class="dn" style="background:conic-gradient(${g})"></div>`+e.map((x,i)=>`<div class="row"><span><span style="color:${COL[i%6]}">●</span> ${esc(x[0])}</span><b>${rs(x[1])}</b></div>`).join('')}
function trend(rows,days){const m={};for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);m[d.toLocaleDateString('en-CA')]=0}rows.forEach(s=>{if(s.sale_date in m)m[s.sale_date]+=Number(s.total_amount)});const v=Object.values(m),mx=Math.max(...v,1),n=v.length,pts=v.map((x,i)=>[10+i*(300/(n-1)),90-(x/mx)*80]);return`<svg viewBox="0 0 320 100" width="100%"><polygon points="10,90 ${pts.map(p=>p.join(',')).join(' ')} 310,90" fill="rgba(99,102,241,.15)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#6366F1" stroke-width="2.5"/>${mx<=1?'':''}</svg>`}
/* ----- Nayi Sale helpers (same rules as the DMS Sales form) ----- */
const prod=id=>K('stock').find(p=>String(p.id)===String(id));
const isBox=id=>(prod(id)||{}).packing_type==='carton_box_piece';
const mult=(id,u)=>u==='piece'?1:u==='box'?((prod(id)||{}).pieces_per_box||1):((prod(id)||{}).pieces_per_carton||1);
const newItem=()=>({pid:'',label:'',unit:'carton',qty:'',rate:'',disc:''});
const lineTot=i=>(Number(i.qty)||0)*mult(i.pid,i.unit)*(Number(i.rate)||0)-(Number(i.disc)||0);
const remLabel=a=>[a.remaining_cartons?a.remaining_cartons+' Carton':'',a.remaining_boxes?a.remaining_boxes+' Box':'',a.remaining_pcs?a.remaining_pcs+' pcs':''].filter(Boolean).join(' + ')||'0';
function hints(i){const p=prod(i.pid);if(!p)return'';const bi=K('batchinfo')[p.id],out=(p.stock_pieces||0)<=0;let h='';
 if(out)return`<span class="hint r1">⚠️ Out of Stock — pehle iska purchase karein, tab tak isay sale nahi kar sakte.</span>`;
 h+=`<span class="hint b1">💡 Current Price: Rs ${r2((p.purchase_price||0)/(p.pieces_per_carton||1))} per piece</span>`;
 if(bi&&bi.active&&bi.next&&bi.next.price_per_piece<bi.active.price_per_piece-.0001)h+=`<span class="hint b1">💡 Price Updated: Rs ${r2(bi.active.price_per_piece)} → Rs ${r2(bi.next.price_per_piece)} per piece — Old price stock remaining: ${remLabel(bi.active)}</span>`;
 const need=(Number(i.qty)||0)*mult(i.pid,i.unit);if(need>(p.stock_pieces||0))h+=`<span class="hint r1">⚠️ Sirf ${p.stock_pieces} pcs available hain.</span>`;return h}
const stockText=p=>[p.stock_cartons?p.stock_cartons+' Carton':'',p.stock_boxes?p.stock_boxes+' Box':'',p.stock_pcs?p.stock_pcs+' pcs':''].filter(Boolean).join(' + ')||'0';
function picker(el,list,pick){const box=el.parentNode.querySelector('.pkl');
 const show=()=>{const r=list(el.value.trim().toLowerCase()).slice(0,40);box._r=r;box.innerHTML=r.length?r.map((x,i)=>`<div data-k="${i}"><b>${x.t}</b><small>${x.s}</small></div>`).join(''):'<div><small>Koi match nahi mila</small></div>';box.classList.add('show')};
 el.addEventListener('focus',()=>{show();setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),300)});el.addEventListener('input',show);
 el.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('show'),250));
 box.addEventListener('pointerdown',e=>{const d=e.target.closest('[data-k]');if(!d)return;e.preventDefault();const x=box._r[d.dataset.k];box.classList.remove('show');el.blur();pick(x)})}
const custList=q=>{let dq=q.replace(/\D/g,'');if(dq.startsWith('92'))dq=dq.slice(2);else if(dq.startsWith('0'))dq=dq.slice(1);return custSrc().filter(c=>!q||(c.shop_name+' '+(c.owner_name||'')+' '+(c.phone||'')).toLowerCase().includes(q)||(dq&&(c.phone||'').replace(/\D/g,'').includes(dq))).map(c=>({id:c.id,t:esc(c.shop_name),s:esc([c.owner_name,c.phone].filter(Boolean).join(' · ')),raw:c}))};
const prodList=q=>K('stock').filter(p=>!q||(p.name+' '+(p.code||'')+' '+(p.company_name||'')).toLowerCase().includes(q)).map(p=>({id:p.id,t:esc(p.name),s:esc([p.company_name,p.code].filter(Boolean).join(' · '))+((p.stock_pieces||0)<=0?' · <span style="color:var(--bad)">Out of stock</span>':' · '+esc(stockText(p)))}));
const unitOpts=id=>(isBox(id)?['carton','box','piece']:['carton','piece']);
function saleView(){const cl=custSrc(),pl=K('stock');return`<h1>Nayi Sale</h1>${isMgr()?mFail(['m_sale']):''}<div class="note">${isMgr()?'Manager ki sale seedha final hoti hai aur stock kam ho jata hai.':'Sale submit karne ke baad Owner ya Manager ke Confirm karte hi yeh final hogi aur stock kam hoga.'} Rate hamesha per-piece daalein.</div><div class="card">
<label>Customer</label><div class="pk"><input id="cust" autocomplete="off" placeholder="Number ya naam type karein..." value="${esc(S.cust)}"><div class="pkl"></div></div><div class="g" style="grid-template-columns:1fr 1fr"><div><label>Invoice Number</label><input id="inv" value="${esc(S.inv)}"></div><div><label>Date</label><input id="dt" type="date" value="${S.date}"></div></div>
${S.items.map((it,i)=>{const out=prod(it.pid)&&(prod(it.pid).stock_pieces||0)<=0;return`<div class="it"><label>Product</label><div class="pk"><input data-f="label" data-i="${i}" autocomplete="off" placeholder="Search product..." value="${esc(it.label)}"><div class="pkl"></div></div><div class="gr"><div><label>Unit</label><select data-f="unit" data-i="${i}" ${out?'disabled':''}>${unitOpts(it.pid).map(u=>`<option value="${u}" ${u===it.unit?'selected':''}>${u[0].toUpperCase()+u.slice(1)}</option>`).join('')}</select></div><div><label>Qty</label><input data-f="qty" data-i="${i}" type="number" inputmode="decimal" placeholder="Qty" value="${esc(it.qty)}" ${out?'disabled':''}></div><div><label>Rate/Piece</label><input data-f="rate" data-i="${i}" type="number" inputmode="decimal" placeholder="Rate/Piece" value="${esc(it.rate)}" ${out?'disabled':''}></div><div><label>Discount</label><input data-f="disc" data-i="${i}" type="number" inputmode="decimal" placeholder="0" value="${esc(it.disc)}" ${out?'disabled':''}></div></div><div id="h${i}">${hints(it)}</div><div class="row"><b id="lt${i}">${rs(lineTot(it))}</b><button class="s" data-rm="${i}">✕</button></div></div>`}).join('')}
<button class="s" id="add">+ Add Item</button><div class="row" style="margin-top:12px"><b style="font-size:18px" id="tot">Total: ${rs(S.items.reduce((s,i)=>s+lineTot(i),0))}</b></div><div class="err">${esc(msg)}</div><button class="p full" id="sub">Save Sale</button></div>`}
const MD=new Set();const custSrc=()=>localStorage.getItem('sm_role')==='manager'?K('m_customers'):K('allcustomers');
const when=t=>t?new Date(String(t).replace(' ','T')+(/Z|\+/.test(String(t))?'':'Z')).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const mFail=types=>D.outbox.filter(o=>types.includes(o.type)&&o.status==='failed'&&Date.now()-new Date(o.created_at).getTime()<864e5).map(o=>`<div class="card"><span class="pill bd">Nahi hua</span> ${esc((o.result||{}).error||'Masla')}</div>`).join('');

async function flush(){if(flushing||!tok||!Q.length||!navigator.onLine)return;flushing=true;const me=localStorage.getItem('sm_name');
 try{while(Q.length){const it=Q[0];if(it.u&&it.u!==me)break;
  try{await api('/submit',{method:'POST',body:JSON.stringify({type:it.type,payload:it.payload,client_ref:it.client_ref})});Q.shift();saveQ();refreshBar()}
  catch(e){if(isNet(e)||/Login dobara/.test(e.message))break;QF.push({...it,error:e.message});Q.shift();saveQ();refreshBar()}}}

async function submit(type,payload){const item={type,payload,client_ref:crypto.randomUUID(),at:Date.now(),u:localStorage.getItem('sm_name')};

 if(type==='report')return send();
 if(!navigator.onLine||Q.length){enqueue(item);flush();return{queued:true}}
 try{return await send()}catch(e){if(isNet(e)){enqueue(item);return{queued:true}}throw e}}

async function doExport(fmt){if(!EXP)return;toast(fmt==='pdf'?'PDF ban rahi hai…':'Image ban rahi hai…');

  let blob;if(fmt==='pdf')blob=SMX.buildPdf(EXP.type,EXP.data,meta);else{const dk=document.body.classList.contains('dark');document.body.classList.remove('dark');document.body.classList.add('exporting');try{blob=await SMX.buildPngBlob(document.querySelector(EXP.node),meta)}finally{document.body.classList.remove('exporting');if(dk)document.body.classList.add('dark')}}
  const safe=x=>String(x).replace(/[^a-z0-9-_]+/gi,'-'),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${EXP.type}-report-${safe(EXP.period)}${EXP.filter?'-'+safe(EXP.filter):''}.${fmt}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Download shuru ho gayi — Downloads folder check karein.')}
